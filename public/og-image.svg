  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="110" x2="1010" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="100" r="260" fill="#38bdf8" opacity=".13"/>
  <circle cx="150" cy="600" r="280" fill="#a78bfa" opacity=".16"/>
  <rect x="80" y="72" width="1040" height="486" rx="42" fill="url(#card)" stroke="#bfdbfe" stroke-opacity=".28"/>
